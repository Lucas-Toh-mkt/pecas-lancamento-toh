function upload(files){

}

/* ---------- offline export ---------- */
function exportOffline(){
  var ids = {}, list = [], vis = visibleDays();
  if (!vis.length){ toast("Nenhum dia está visível para a diretoria. Mostre ao menos um dia antes de baixar."); return; }
  vis.forEach(function(d){ piecesOf(d).forEach(function(p){ (p.media || []).concat(p.cover ? [p.cover] : [], p.covers || []).forEach(function(m){ if (!ids[m.id]){ ids[m.id] = 1; list.push(m.id); } }); }); });
  var parts = [], i = 0;
  function b64(blob){ return new Promise(function(res, rej){ var fr = new FileReader(); fr.onload = function(){ res(fr.result); }; fr.onerror = rej; fr.readAsDataURL(blob); }); }
  function next(){
    if (i >= list.length) return Promise.resolve();
    var id = list[i++]; toast("Preparando a versão offline: arquivo " + i + " de " + list.length + "…", true);
    return fetch("/_blob/" + id).then(function(r){ return r.blob(); }).then(b64).then(function(u){ parts.push(JSON.stringify(id) + ":" + JSON.stringify(u) + ","); return next(); }, function(){ return next(); });
  }
  next().then(function(){
    var style = document.getElementById("app-style").textContent, script = document.getElementById("app-script").textContent;
    var days = JSON.stringify(vis).replace(/</g, "\\u003c");
    var head = '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Peças do Lançamento · Toh</title>'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"><style>' + style + '</style></head><body><div id="app"></div><script>window.__OFFLINE__={"days":' + days + ',"media":{';
    var tail = '"_":""}};<\/script><script>' + script.replace(/<\/script/gi, "<\\/script") + '<\/script></body></html>';
    var blob = new Blob([head].concat(parts, [tail]), {type:"text/html"});
    toast("Arquivo pronto (" + Math.round(blob.size / 1048576) + " MB). Confirme o download.", true);
    return S.downloads.save({filename:"pecas-lancamento-toh.html", data: blob}).then(function(){ toast("Versão offline baixada. Envie o arquivo por Drive ou WeTransfer."); },
      function(e){ toast(e && e.code === "declined" ? "Download cancelado." : "Não foi possível baixar o arquivo agora. Tente de novo."); });
  });
}

/* ---------- boot ---------- */

function resolveProfiles(){

function boot(){

function start(c){

    S.db = r[0]; S.user = r[1]; S.assets = r[2]; S.downloads = r[3];

      }, function(){});
    });

}
boot();
